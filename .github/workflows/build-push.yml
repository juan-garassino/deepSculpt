name: build-push

on:
  push:
    branches: [master]
    paths:
      - 'runpod/**'
      - 'deepsculpt/**'
      - 'requirements*.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: runpod/Dockerfile
          push: true
          tags: |
            ghcr.io/juan-garassino/deepsculpt-runpod:latest
            ghcr.io/juan-garassino/deepsculpt-runpod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
